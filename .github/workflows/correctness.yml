name: Correctness before performance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r base_tls/requirements.lock.txt
          python -m pip install --require-hashes -r reference/requirements.lock.txt
          python tools/install_falcon_provider.py
      - name: Fresh native correctness
        env:
          OMP_NUM_THREADS: '2'
          OMP_DYNAMIC: 'FALSE'
        run: make -C c OUT=../build/ci-native CFLAGS=-O3 all test review-test repair-test avx2-test wots-test prehash-test fault-test guard-test cuda-cleanup-host-test
      - name: Regression and bounded parser mutations
        run: python -B ops/run_review_checks.py --native-library build/ci-native/libslhdsa_sm3.so --output build/ci-review
      - name: Sanitizers
        env:
          OMP_NUM_THREADS: '2'
          OMP_DYNAMIC: 'FALSE'
        run: make -C c OUT=../build/ci-sanitizers sanitizer
